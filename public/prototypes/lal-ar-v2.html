<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LAL AR Phone Prototype v2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap">
<style>
/* Single-theme prototype of the LAL light theme: every color is set explicitly. */
:root {
  color-scheme: light;
  --ink: #000000; --paper: #ffffff; --lime: #e8ff36; --grey: #f5f5f5; --beige: #F2EEEB;
  --line: #e3e3e3; --muted: #707070; --red: #8e0000;
  --wall: #ebe5de; --floor: #cfc4b8; --cam: #1b1b1b;
  --font: 'Poppins', system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; }
a { color: inherit; }
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.topline { background: var(--lime); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; text-align: center;
  padding: calc(9px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 9px max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-right, 0px)) calc(64px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 32px; }
header { max-width: 720px; }
h1 { font-size: 28px; line-height: 1.15; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; margin: 0 0 10px; }
h3 { font-size: 16px; font-weight: 600; margin: 0; }
p { margin: 0 0 10px; }
.lead { font-size: 16px; font-weight: 300; }
.sub { color: var(--muted); font-size: 14px; }
code { font-family: var(--mono); font-size: .88em; background: var(--grey); padding: 1px 5px; }

.proto { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 40px; align-items: start; }
@media (min-width: 921px) { .stage { position: sticky; top: 16px; padding: 24px 12px; min-height: 0; } }
@media (max-width: 920px) { .proto { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 420px) { .stage { padding: 16px 0; min-height: 0; background: none; border: 0; } }
.stage { background: var(--grey); border: 1px solid var(--line); padding: 32px 12px; display: grid; place-items: center; min-height: 700px; }

.panel { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.steps { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.steps li { border-bottom: 1px solid var(--line); }
.steps button { width: 100%; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; text-align: left; background: none; border: 0; padding: 7px 0; font-size: 14px; cursor: pointer; }
.steps button i { font-style: normal; font-weight: 700; font-size: 11px; width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--ink); }
.steps button:hover span { text-decoration: underline; }
.steps button[aria-current="step"] { font-weight: 600; }
.steps button[aria-current="step"] i { background: var(--lime); border-color: var(--lime); }
.note { background: var(--grey); padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.note p { margin: 0; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 11px; font-weight: 600; padding: 2px 8px; border: 1px solid var(--ink); white-space: nowrap; }
.chip.must { background: var(--ink); color: var(--paper); }
.chip.nice { background: var(--lime); border-color: var(--lime); }
.chip.later { background: var(--beige); border-color: var(--beige); }
.chip.no { color: var(--red); border-color: var(--red); background: var(--paper); text-decoration: line-through; }
.optrow { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.optrow > span { font-size: 13px; color: var(--muted); }
.seg { display: flex; border: 1px solid var(--ink); }
.seg button { flex: 1; background: var(--paper); border: 0; padding: 8px 6px; font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 600; }
.restart { background: var(--paper); border: 1px solid var(--ink); padding: 8px 14px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }
.faked { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }

/* device frames */
.phone { width: 316px; height: 636px; border: 8px solid var(--ink); border-radius: 40px; overflow: hidden; position: relative; background: var(--paper); flex: none; }
.scr { position: absolute; inset: 0; overflow: hidden; font-size: 12px; line-height: 1.4; user-select: none; -webkit-user-select: none; }
.laptop { width: min(640px, 100%); aspect-ratio: 16 / 10; border: 8px solid var(--ink); border-bottom-width: 18px; border-radius: 12px 12px 4px 4px; position: relative; overflow: hidden; background: var(--paper); }
[hidden] { display: none !important; }

/* store UI */
.scroll { position: absolute; inset: 0; overflow-y: auto; }
.ann { background: var(--lime); text-align: center; font-size: 9.5px; font-weight: 600; padding: 4px 0; letter-spacing: .05em; }
.bar { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 11px; letter-spacing: .14em; }
.bag { position: relative; display: inline-grid; }
.bag b { position: absolute; right: -7px; top: -6px; background: var(--lime); font-size: 9px; letter-spacing: 0; min-width: 15px; height: 15px; border-radius: 99px; display: grid; place-items: center; }
.gal { background: var(--grey); height: 230px; position: relative; display: grid; place-items: center; }
.scroll .gal { padding-bottom: 44px; }
.arbtn { position: absolute; right: 10px; bottom: 10px; background: var(--lime); color: var(--ink); border: 0; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 9px 14px; cursor: pointer; box-shadow: 0 2px 6px rgb(0 0 0 / .12); }
.arbtn:hover { background: #d9f020; }
.arbtn, .btn.ic { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.rot { width: 1.6em; height: 1.6em; flex: none; }
.pad { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.pt { font-weight: 600; font-size: 14px; }
.price { color: var(--ink); font-weight: 600; font-size: 15px; }
.field { border: 1px solid #ccc; border-radius: 8px; padding: 7px 10px; font-size: 10.5px; color: var(--muted); display: flex; flex-direction: column; gap: 1px; }
.field input, .field select { border: 0; padding: 0; font: 400 13px var(--font); color: var(--ink); background: transparent; width: 100%; outline: none; }
.field:focus-within { border-color: var(--ink); }
.lblrow { font-size: 11px; font-weight: 600; display: flex; gap: 6px; }
.lblrow span { font-weight: 400; color: var(--muted); }
.btn { display: block; width: 100%; border: 0; background: var(--ink); color: var(--paper); text-transform: uppercase; font-weight: 600; font-size: 11px; letter-spacing: .06em; text-align: center; padding: 12px 8px; cursor: pointer; }
.btn.sec { background: var(--paper); color: var(--ink); border: 1px solid var(--ink); }
.btn.lime { background: var(--lime); color: var(--ink); }
.btn:disabled { opacity: .35; cursor: default; }
.lnk { background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; font-size: inherit; }
.pnote { padding: 9px 10px; font-size: 11px; }
.pnote.lime { background: var(--lime); }
.pnote.grey { background: var(--grey); display: flex; flex-direction: column; gap: 6px; }
.pnote table { border-collapse: collapse; width: 100%; font-size: 10.5px; }
.pnote td { padding: 2px 0; border-bottom: 1px solid var(--line); }
.sw { display: flex; gap: 10px; }
.sw button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #bbb; cursor: pointer; padding: 0; }
.sw button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }

/* artwork */
.art { position: absolute; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 12px rgb(0 0 0 / .3); overflow: hidden; }
.art.flat { position: relative; box-shadow: 0 3px 8px rgb(0 0 0 / .18); }
.art .vinyl { border-radius: 50%; flex: none; background: radial-gradient(circle, var(--vc, #DC7957) 0 33%, #111 34% 47%, #2a2a2a 48% 49%, #111 50% 100%); }
.art .sn { font-weight: 700; line-height: 1.1; max-width: 88%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #111; }
.art .sa { line-height: 1.1; color: #555; max-width: 88%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.art .pb { height: 2px; background: #333; flex: none; }
#wallArt { cursor: grab; touch-action: none; }
#wallArt:active { cursor: grabbing; }

/* camera scene */
.room { position: absolute; inset: 0; background: var(--cam); overflow: hidden; touch-action: none; }
.room .wall { position: absolute; left: 0; right: 0; top: 0; height: 430px; background: linear-gradient(180deg, #e2dbd3, var(--wall) 60%); }
.room .floor { position: absolute; left: 0; right: 0; top: 430px; bottom: 0; background: linear-gradient(180deg, var(--floor), #b8ab9d); }
.room .base { position: absolute; left: 0; right: 0; top: 424px; height: 6px; background: #f6f2ee; }
.room svg { position: absolute; }
.room .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgb(0 0 0 / .28)); pointer-events: none; }
.room.dim > :not(.vig) { filter: blur(3px) brightness(.55); }
.hud { position: absolute; top: 14px; left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 5; }
.round { width: 34px; height: 34px; border-radius: 50%; background: rgb(0 0 0 / .45); border: 0; color: var(--paper); font-size: 15px; font-weight: 600; display: grid; place-items: center; cursor: pointer; }
.toast { position: absolute; left: 14px; right: 14px; background: rgb(0 0 0 / .72); color: var(--paper); padding: 9px 12px; font-size: 12px; text-align: center; border-radius: 4px; z-index: 4; pointer-events: none; }
.toast.ok { background: var(--lime); color: var(--ink); font-weight: 600; }
.pill { position: absolute; background: var(--paper); color: var(--ink); font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; transform: translateX(-50%); box-shadow: 0 1px 3px rgb(0 0 0 / .2); pointer-events: none; z-index: 3; }
.reticle { position: absolute; left: 50%; top: 220px; width: 110px; height: 110px; transform: translateX(-50%); animation: pulse 1.4s ease-in-out infinite; }
.reticle::before { content: ""; position: absolute; inset: 0; border: 2px solid var(--paper); clip-path: polygon(0 0,30% 0,30% 4%,4% 4%,4% 30%,0 30%, 0 70%,4% 70%,4% 96%,30% 96%,30% 100%,0 100%, 100% 100%,70% 100%,70% 96%,96% 96%,96% 70%,100% 70%, 100% 30%,96% 30%,96% 4%,70% 4%,70% 0,100% 0); }
.reticle.ok { animation: none; }
.reticle.ok::before { border-color: var(--lime); border-width: 3px; }
@keyframes pulse { 50% { transform: translateX(-50%) scale(.9); opacity: .7; } }
.calib { position: absolute; left: 0; right: 0; height: 0; border-top: 3px dashed var(--lime); z-index: 3; pointer-events: none; }
.calib .h { position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--lime); border: 2px solid var(--ink); }
.calib.ok { border-top-style: solid; }
.calib.ok .h { background: var(--ink); border-color: var(--lime); }
.dragzone { position: absolute; inset: 0; z-index: 2; cursor: ns-resize; touch-action: none; }
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 12px 18px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(0deg, rgb(0 0 0 / .65), transparent); z-index: 4; }
.dock .btn.lime { border-radius: 4px; padding: 14px 8px; font-size: 12px; }
.hud .grp { display: flex; gap: 8px; }
.shutter { width: 58px; height: 58px; border-radius: 50%; border: 5px solid var(--paper); background: rgb(255 255 255 / .3); flex: none; cursor: pointer; padding: 0; }
.shutter:active { background: rgb(255 255 255 / .7); }
.cfg { background: var(--paper); color: var(--ink); border: 0; font-size: 12px; padding: 9px 12px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; }
.cfg .cfgt { min-width: 0; display: flex; flex-direction: column; }
.cfg .cfgt b { font-weight: 600; }
.cfg .chg { font-size: 11px; font-weight: 600; text-decoration: underline; white-space: nowrap; flex: none; }
.cfg small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.cfg.lime { background: var(--lime); font-weight: 600; font-size: 11px; padding: 10px 12px; white-space: nowrap; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); background: rgb(0 0 0 / .55); color: var(--paper); padding: 6px 12px; border-radius: 99px; font-size: 11px; white-space: nowrap; pointer-events: none; z-index: 3; transition: opacity .3s; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); border-radius: 10px 10px 0 0; padding: 10px 14px 18px; display: flex; flex-direction: column; gap: 9px; z-index: 6; }
.scr.enter .sheet, .scr.cartin .cart { animation: up .25s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet .grab { width: 36px; height: 4px; background: var(--line); border-radius: 4px; align-self: center; }
.sheet .lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; display: flex; justify-content: space-between; }
.sheet .lbl span { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); }
.sheet .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet .foot .btn { width: auto; padding: 10px 24px; }
.opts { display: flex; gap: 5px; }
.opts button { flex: 1; font: 600 11px var(--font); padding: 6px 2px; border: 1px solid #ccc; background: var(--paper); cursor: pointer; border-radius: 4px; line-height: 1.25; }
.opts button small { display: block; font-weight: 400; color: var(--muted); font-size: 9.5px; }
.opts button[aria-pressed="true"] { border: 1.5px solid var(--ink); background: var(--grey); }
.samp { display: flex; align-items: center; gap: 6px; font-size: 11.5px; background: var(--grey); padding: 7px 9px; }
.samp .tag { background: var(--lime); font-size: 9px; font-weight: 700; text-transform: uppercase; padding: 1px 5px; letter-spacing: .05em; }
.samp .lnk { margin-left: auto; font-size: 11px; font-weight: 600; }
.perso { display: flex; flex-direction: column; gap: 6px; }

.sysdlg { position: absolute; inset: 0; background: rgb(0 0 0 / .35); display: grid; place-items: center; z-index: 10; }
.sysdlg > div { width: 250px; background: rgb(245 245 245 / .97); border-radius: 14px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
.sysdlg p { padding: 16px 16px 12px; margin: 0; font-size: 13px; }
.sysdlg p b { display: block; margin-bottom: 4px; }
.sysdlg .r { display: flex; border-top: 1px solid #ccc; }
.sysdlg .r button { flex: 1; background: none; border: 0; padding: 11px; color: #0a63d6; font-size: 14px; cursor: pointer; font-family: inherit; }
.sysdlg .r button + button { border-left: 1px solid #ccc; font-weight: 600; }
.flash { position: absolute; inset: 0; background: #fff; z-index: 9; pointer-events: none; animation: flash .5s ease-out forwards; }
@keyframes flash { to { opacity: 0; } }
.photoframe { position: absolute; inset: 0; border: 12px solid var(--paper); z-index: 4; pointer-events: none; }

.cartwrap { position: absolute; inset: 0; z-index: 12; }
.cartwrap .scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .45); }
.cart { position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); padding: 16px 14px 20px; display: flex; flex-direction: column; gap: 12px; border-radius: 10px 10px 0 0; }
.cart h4 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
.item { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.item .thumb { width: 64px; height: 80px; background: var(--grey); display: grid; place-items: center; }
.upsell { border: 1px dashed #bbb; padding: 9px 10px; color: var(--muted); font-size: 11px; }

.ptoast { position: absolute; left: 20px; right: 20px; top: 60px; background: var(--ink); color: var(--paper); padding: 9px 12px; font-size: 11.5px; text-align: center; border-radius: 4px; z-index: 20; opacity: 0; transform: translateY(-6px); transition: all .2s; pointer-events: none; }
.ptoast.show { opacity: 1; transform: none; }

/* laptop */
.lnav { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 10px; letter-spacing: .14em; }
.lpdp { position: absolute; inset: 34px 0 0; display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; padding: 14px 18px; }
.lpdp .gal { height: auto; }
.lpdp .col { display: flex; flex-direction: column; gap: 7px; min-width: 0; font-size: 11px; }
.lpdp .field { padding: 5px 8px; }
.lpdp .field input, .lpdp .field select { font-size: 11px; }
.lpdp .btn { padding: 8px; font-size: 10px; }
.lscrim { position: absolute; inset: 0; background: rgb(0 0 0 / .45); z-index: 5; }
.lmodal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(82%, 470px); background: var(--paper); padding: 18px; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; border-radius: 8px; font-size: 11.5px; z-index: 6; }
.lmodal h4 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
.lmodal ol { margin: 0; padding-left: 16px; }
.lmodal .x { position: absolute; top: 6px; right: 8px; background: none; border: 0; font-size: 16px; cursor: pointer; }
.lmodal .btn { margin-top: 10px; padding: 8px; font-size: 10px; }
.qr { width: 110px; height: 110px; }
@media (prefers-reduced-motion: reduce) { .reticle, .sheet, .cart, .flash { animation: none; } .flash { opacity: 0; } }
/* ---------- Personalize panel, matched to sites2026 CustomizerPanel (mobile computed styles) ---------- */
.cz-wrap { position: absolute; inset: 0; z-index: 15; font-family: 'Poppins', system-ui, sans-serif; color: #000; }
.cz-scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .45); }
.cz-panel { position: absolute; inset: 0; background: #fff; border-radius: 8px 8px 0 0; overflow: hidden; display: flex; flex-direction: column; }
.cz-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.czin .cz-panel { animation: czup .3s ease-out; }
@keyframes czup { from { transform: translateY(40px); opacity: 0; } }
.cz-x { position: absolute; top: 16px; right: 16px; z-index: 2; width: 36px; height: 36px; border-radius: 9999px; border: 0; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .08); display: grid; place-items: center; padding: 0; cursor: pointer; }
.cz-x svg { width: 20px; height: 20px; }
.cz-prev { flex: none; background: #f5f5f5; padding: 16px; display: grid; place-items: center; }
.cz-body { padding: 24px 16px; }
.cz-tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #e3e3e3; border-radius: 8px; overflow: hidden; }
.cz-tab { display: grid; grid-template-columns: 24px 1fr; column-gap: 10px; align-items: center; padding: 14px 16px; background: #f5f5f5; border: 0; border-bottom: 2px solid transparent; text-align: left; cursor: pointer; font-family: inherit; color: #707070; }
.cz-tab.on { background: #fff; border-bottom-color: #e8ff36; color: #000; }
.cz-tab .st { grid-row: 1 / 3; width: 24px; height: 24px; border-radius: 9999px; border: 1px solid #707070; display: grid; place-items: center; font-size: 11px; line-height: 16.5px; font-weight: 700; }
.cz-tab.on .st { background: #e8ff36; border-color: #e8ff36; color: #000; }
.cz-tab .tt { font-size: 14px; line-height: 21px; font-weight: 600; }
.cz-tab .ts { font-size: 12px; line-height: 18px; color: #707070; }
.cz-step { display: flex; flex-direction: column; gap: 24px; padding-top: 24px; }
.cz-step .lp-note { margin-top: 0; }
.cz-l { font-size: 13px; line-height: 19.5px; font-weight: 600; letter-spacing: .13px; }
.cz-l span { font-weight: 400; color: #707070; }
.cz-lr { display: flex; justify-content: space-between; align-items: center; }
.cz-sg { border: 0; background: none; padding: 0; font: 400 12px/18px 'Poppins', system-ui, sans-serif; color: #707070; text-decoration: underline; cursor: pointer; }
.cz-sw { display: flex; gap: 12px; }
.cz-sw button { width: 32px; height: 32px; border-radius: 9999px; border: 0; padding: 0; cursor: pointer; }
.cz-sw button.light { border: 1px solid #e3e3e3; }
.cz-sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px #f5f5f5, 0 0 0 3.5px #000; }
.cz-mat, .cz-sel { position: relative; }
.cz-mat select, .cz-sel select { width: 100%; -webkit-appearance: none; appearance: none; background: #fff; border: 1px solid #ccc; border-radius: 4px; color: #000; outline: none; cursor: pointer; }
.cz-mat select { height: 54px; padding: 6px 40px 6px 64px; font: 400 14px/21px 'Poppins', system-ui, sans-serif; }
.cz-sel select { height: 44px; padding: 0 40px 0 14px; font: 400 16px/24px 'Poppins', system-ui, sans-serif; }
.cz-mat select:focus, .cz-sel select:focus { border-color: #000; }

  }
  function enterAR(fromQR) {
    S.snap = { size: S.size, mat: S.mat, frame: S.frame, song: S.song, artist: S.artist };
    Object.assign(S, { returned: false, fallback: false, fromQR: !!fromQR, cx: null, cy: null, moved: false, perso: false, perm: false, cart: false, find: 'looking', retried: false, lineY: LINE_START, floorY: FLOOR });
    S.screen = 'cam'; render();
    if (fromQR) toast('Opened from your QR code. Your choices came with you.');
  }
  // Save writes the AR choices to the product page; close (✕) drops them.
  function leaveAR(save) {
    if (!save && S.snap) Object.assign(S, { size: S.snap.size, mat: S.snap.mat, frame: S.snap.frame, song: S.snap.song, artist: S.snap.artist });
    go('pdp', { returned: !!save, perso: false, cust: true, tab: 2 });
  }

  var HELP = {
    find: 'Tips: more light, step back, aim at a plain part of the wall.',
    line: 'Find the skirting board, the strip where the wall meets the floor, and drag the line onto it.',
    place: 'Drag the canvas with one finger. Tap Change for size or material. Save when it looks right.',
    adjust: 'Tap a size to see it on the wall at its real size. Drag the canvas to move it.'
  };

  function act(a) {
    if (S.cust && S.ar && arAct(a)) return;
    if (a === 'v2ar') return startAR();
    switch (a) {
      case 'ar': enterAR(false); break;
      case 'qr': go('qr'); break;
      case 'closeqr': go('desk'); break;
      case 'scan': enterAR(true); break;
      case 'allow': S.perm = true; render(); break;
      case 'grant': S.perm = false; go('find', { find: 'looking', retried: false }); break;
      case 'deny': case 'notnow': go('pdp', { perm: false, fallback: true, returned: false, cust: true, tab: 2 }); toast(a === 'deny' ? 'Camera blocked. You can turn it on in your browser settings.' : 'No problem. Here\'s the size guide.'); break;
      case 'retry': go('find', { find: 'looking', retried: true }); break;
      case 'lineok': go('place', { floorY: S.lineY, cx: null, cy: null }); if (Math.abs(S.lineY - FLOOR) > 1) toast('The line is above the skirting board, so the canvas hangs too high. Go back to E to fix it.'); break;
      case 'adjust': go('adjust'); break;
      case 'done': go('place', { perso: false }); break;
      case 'persodone': S.perso = false; render(); break;
      case 'perso': S.perso = true; render(); var i = $('#gSong'); if (i) i.focus(); break;
      case 'shoot': go('photo', { shot: true }); S.shot = false; break;
      case 'back': go('place'); break;
      case 'share': toast('Your phone\'s share sheet opens here.'); break;
      case 'bag': S.cust = false; S.cart = true; S.bag += 1; render(); break;
      case 'tab1': S.tab = 1; render(); break;
      case 'tab2': S.tab = 2; render(); break;
      case 'custclose': S.cust = false; render(); break;
      case 'nest': S.nest = !S.nest; render(); break;
      case 'vir': if (S.screen === 'desk') go('qr'); else enterAR(false); break;
      case 'sizeguide': toast('Opens the size guide, as on the live site.'); break;
      case 'closecart': S.cart = false; render(); break;
      case 'checkout': toast('Checkout opens here. That\'s the end of the prototype.'); break;
      case 'autofill': Object.assign(S, { song: 'Yellow', artist: 'Coldplay', occ: 'Our Wedding Song', names: 'Alex & Max, 10.10.2021', center: '#91A36B' }); render(); break;
      case 'preview': S.cust = true; S.tab = 2; S.virMini = false; S.virEnter = true; render(); S.virEnter = false; virCollapseSoon(); break;
      case 'quick': toast('Opens Quick Add, as on the live site.'); break;
      case 'toreviews': var rv = $('#reviews'), sc = $('#scr .scroll'); if (rv && sc) sc.scrollTo({ top: rv.offsetTop - 64, behavior: 'smooth' }); break;
      case 'close': leaveAR(false); break;
      case 'save': leaveAR(true); break;
      case 'help': toast(HELP[S.screen] || 'Follow the instruction at the top of the screen.'); break;
    }
  }

  function bind() {
    var song = $('#inSong'), artist = $('#inArtist'), size = $('#inSize'), mat = $('#inMat');
    function liveFlat() {
      var g1 = $('#gs1'), g2 = $('#gs2');
      if (g1) { g1.innerHTML = flatArt(170, 215); g2.innerHTML = roomSlide(); return; }
      var holder = $('#pdpArt'); if (holder) holder.innerHTML = flatArt(130, 170);
    }
    var gt = $('#gtrack'), gp = $('#gprog');
    if (gt) gt.addEventListener('scroll', function () { gp.style.transform = 'translateX(' + Math.round(gt.scrollLeft / gt.clientWidth) * 100 + '%)'; }, { passive: true });
    if (song) song.addEventListener('input', function () { S.song = song.value; liveFlat(); });
    [['inOcc', 'occ'], ['inNames', 'names']].forEach(function (p) { var el = document.getElementById(p[0]); if (el) el.addEventListener('input', function () { S[p[1]] = el.value; }); });
    if (artist) artist.addEventListener('input', function () { S.artist = artist.value; liveFlat(); });
    if (size) size.addEventListener('change', function () { S.size = size.value; render(); });
    if (mat) mat.addEventListener('change', function () { S.mat = mat.value; render(); });
    [['pSong', 'song'], ['pArtist', 'artist'], ['pOcc', 'occ'], ['pNames', 'names']].forEach(function (p) {
      var el = document.getElementById(p[0]); if (!el) return;
      el.addEventListener('input', function () { S[p[1]] = el.value; if (S.ar === 'on' && (p[1] === 'song' || p[1] === 'artist')) refreshWallArt(); var pv = $('#czPrev'); if (pv && p[1] !== 'occ' && p[1] !== 'names') pv.innerHTML = flatArt(pv.clientWidth * 0.5, pv.clientWidth * 0.64); });
    });
    var cm = $('#czMat'), cs = $('#czSize');
    if (cm) cm.addEventListener('change', function () { S.mat = cm.value; render(); });
    if (cs) cs.addEventListener('change', function () { S.size = cs.value; render(); });
    var gs = $('#gSong'), ga = $('#gArtist');
    if (gs) gs.addEventListener('input', function () { S.song = gs.value; refreshWallArt(); });
    if (ga) ga.addEventListener('input', function () { S.artist = ga.value; refreshWallArt(); });

    var art = $('#wallArt');
    if (art && (S.screen === 'place' || S.screen === 'adjust' || S.ar === 'on')) {
      art.addEventListener('pointerdown', function (e) {
        if (drag) return; // a second finger is ignored, so pinch does nothing
        var g = geo();
        drag = { id: e.pointerId, x: e.clientX, y: e.clientY, cx: g.cx, cy: g.cy };
        art.setPointerCapture(e.pointerId); e.preventDefault();
      });
      art.addEventListener('pointermove', function (e) {
        if (!drag || e.pointerId !== drag.id) return;
        S.cx = drag.cx + e.clientX - drag.x; S.cy = drag.cy + e.clientY - drag.y;
        var g = geo(); S.cx = g.cx; S.cy = g.cy;
        refreshWallArt();
        if (!S.moved && Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 6) { S.moved = true; var h = $('#hint'); if (h) h.style.opacity = 0; }
      });
      var end = function (e) { if (drag && e.pointerId === drag.id) drag = null; };
      art.addEventListener('pointerup', end); art.addEventListener('pointercancel', end);
    }

    var hd = $('#v2handle'), sh = $('#v2sheet');
    if (hd) {
      var hdr = null;
      hd.addEventListener('pointerdown', function (e) {
        if (hdr) return;
        if (S.ar !== 'on') { toast('Finish placing your canvas first.'); return; }
        var tb = e.target.closest('[data-act]');
        hdr = { id: e.pointerId, y: e.clientY, top: sh.offsetTop, moved: false, tab: tb ? tb.dataset.act : null };
        hd.setPointerCapture(e.pointerId); sh.style.transition = 'none'; e.preventDefault();
      });
      hd.addEventListener('pointermove', function (e) {
        if (!hdr || e.pointerId !== hdr.id) return;
        var dy = e.clientY - hdr.y; if (Math.abs(dy) > 5) hdr.moved = true;
        sh.style.top = clamp(hdr.top + dy, H * 0.3, H - HANDLE) + 'px';
      });
      var hend = function (e) {
        if (!hdr || e.pointerId !== hdr.id) return;
        var t = hdr.top + (e.clientY - hdr.y), moved = hdr.moved, tab = hdr.tab; hdr = null; lastHandleTap = Date.now();
        if (!moved && tab) { S.tab = tab === 'tab1' ? 1 : 2; if (!S.sheetUp) { S.sheetUp = true; render(); setSheetSoon(); } else render(); return; }
        setSheet(moved ? t < H * 0.72 : !S.sheetUp);
      };
      hd.addEventListener('pointerup', hend); hd.addEventListener('pointercancel', hend);
      var hh = hd.offsetHeight;
      if (hh && Math.abs(hh - HANDLE) > 1) {
        HANDLE = hh;
        sh.style.transition = 'none'; sh.style.top = v2top();
        var pv = $('#v2prev'); if (pv) { pv.style.transition = 'none'; pv.style.height = v2prevH(); }
        sh.offsetHeight; sh.style.transition = ''; if (pv) pv.style.transition = '';
      }
    }
    var cf = $('#camfile');
    if (cf) cf.addEventListener('change', function () {
      var file = cf.files && cf.files[0]; if (!file) return;
      if (S.photo) URL.revokeObjectURL(S.photo);
      S.photo = URL.createObjectURL(file);
      Object.assign(S, { src: 'photo', ar: 'line', lineY: Math.round(H * 0.62) }); render();
    });
    var cv = $('#camv');
    if (cv && stream) { cv.srcObject = stream; var pl = cv.play(); if (pl && pl.catch) pl.catch(function () {}); }
    var dz = $('#dragzone');
    if (dz) {
      var ld = null;
      var setY = function (clientY) {
        var r = $('#scr').getBoundingClientRect();
        var y = clamp(clientY - r.top, FLOOR - H * 0.3, FLOOR + H * 0.2);
        if (S.src === 'drawn' && Math.abs(y - FLOOR) < 14) y = FLOOR;
        S.lineY = y;
        var ok = S.src === 'drawn' && y === FLOOR, c = $('#calib'), t = $('#lineToast');
        c.style.top = (y - 1) + 'px'; c.classList.toggle('ok', ok);
        t.classList.toggle('ok', ok); t.textContent = ok ? 'That looks right' : 'Drag the line to where the wall meets the floor';
      };
      dz.addEventListener('pointerdown', function (e) { if (ld != null) return; ld = e.pointerId; dz.setPointerCapture(e.pointerId); setY(e.clientY); e.preventDefault(); });
      dz.addEventListener('pointermove', function (e) { if (e.pointerId === ld) setY(e.clientY); });
      var lend = function (e) { if (e.pointerId === ld) ld = null; };
      dz.addEventListener('pointerup', lend); dz.addEventListener('pointercancel', lend);
    }
  }

  // one delegated click handler for both device frames
  document.getElementById('scr').addEventListener('click', function (e) {
    var t = e.target.closest('button, [data-act]'); if (!t) return;
    if (t.dataset.act) return act(t.dataset.act);
    if (t.dataset.size) { S.size = t.dataset.size; render(); }
    else if (t.dataset.mat) { S.mat = t.dataset.mat; render(); }
    else if (t.dataset.frame) { S.frame = t.dataset.frame; render(); }
    else if (t.dataset.center) { S.center = t.dataset.center; render(); }
  });

  /* G2 (size-only sheet) via #g2 in the URL; G1 otherwise */
  function readHash() { S.variant = location.hash === '#g2' ? 'g2' : 'g1'; }
  readHash();
  window.addEventListener('hashchange', function () { readHash(); render(); });
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (!drag) { measure(); S.cx = null; S.cy = null; S.floorY = FLOOR; S.lineY = LINE_START; render(); } }, 150); });

  render();
})();
</script>
</body>
</html>
