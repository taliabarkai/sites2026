<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Theo Grace — Bow Animation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
#bowImg {
  width: 120px;
  height: auto;
  display: block;
  will-change: transform, opacity;
  opacity: 0;
  flex-shrink: 0;
}
.label {
  display: flex;
  flex-direction: column;
  gap: 3px;
  opacity: 0;
  will-change: opacity;
}
.name {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 15px;
  font-weight: 400;
  font-style: italic;
  color: #1a1a1a;
  letter-spacing: 0.01em;
  line-height: 1.2;
  white-space: nowrap;
}
.role {
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 9px;
  font-weight: 400;
  color: #aaa;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="stage">
  <img id="bowImg" src="YOUR_BOW_IMAGE.png" alt="" aria-hidden="true" draggable="false"/>
  <div class="label" id="label">
    <span class="name">Nicky Hilton</span>
    <span class="role">Co-founder</span>
  </div>
</div>

<script>
const bow   = document.getElementById('bowImg');
const label = document.getElementById('label');

const ENTRY_MS  = 1100;
const SETTLE_MS = 300;
const IDLE_MS   = 2800;
const EXIT_MS   = 700;
const PAUSE_MS  = 400;
const LOOP_MS   = ENTRY_MS + SETTLE_MS + IDLE_MS + EXIT_MS + PAUSE_MS;

function easeOutBack(x) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2);
}
function easeOutCubic(x) { return 1-Math.pow(1-x,3); }
function easeInCubic(x)  { return x*x*x; }

let t0 = null, idleOff = 0;

function getPhase(e) {
  const t = e % LOOP_MS;
  if (t < ENTRY_MS)                               return ['entry',  t/ENTRY_MS];
  if (t < ENTRY_MS+SETTLE_MS)                     return ['settle', (t-ENTRY_MS)/SETTLE_MS];
  if (t < ENTRY_MS+SETTLE_MS+IDLE_MS)             return ['idle',   (t-ENTRY_MS-SETTLE_MS)/IDLE_MS];
  if (t < ENTRY_MS+SETTLE_MS+IDLE_MS+EXIT_MS)     return ['exit',   (t-ENTRY_MS-SETTLE_MS-IDLE_MS)/EXIT_MS];
  return ['pause', 0];
}

function frame(now) {
  if (!t0) t0 = now;
  const elapsed = now - t0;
  const [phase, p] = getPhase(elapsed);

  let tx=0, ty=0, bop=1, bsc=1, brot=0, lop=0;

  if (phase === 'entry') {
    const ep = easeOutCubic(p);
    tx   = 140*(1-ep);
    ty   = -120*(1-ep);
    brot = 20*(1-ep);
    bsc  = 0.5+0.5*ep;
    bop  = Math.min(p*3, 1);
    lop  = 0;
    idleOff = elapsed;
  } else if (phase === 'settle') {
    bsc  = 1 + 0.07*(easeOutBack(p)-1);
    bop  = 1; lop = 0;
  } else if (phase === 'idle') {
    const it = (elapsed - idleOff) * 0.001;
    tx   = Math.sin(it*0.65) * 2;
    ty   = Math.sin(it*1.1)  * 4;
    brot = Math.sin(it*0.5)  * 2.5;
    bsc  = 1 + Math.sin(it*0.9)*0.02;
    bop  = 1;
    lop  = Math.min(p*3, 1);
  } else if (phase === 'exit') {
    const ep = easeInCubic(p);
    tx   = -140*ep;
    ty   = 120*ep;
    brot = -18*ep;
    bsc  = 1-0.35*ep;
    bop  = 1-ep;
    lop  = 1-ep;
  } else {
    bop = 0; lop = 0;
  }

  bow.style.opacity   = bop;
  bow.style.transform = `translate(${tx}px,${ty}px) rotate(${brot}deg) scale(${bsc})`;
  label.style.opacity = lop;

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
